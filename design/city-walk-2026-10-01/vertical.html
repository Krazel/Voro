<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORO · Caminar hacia arriba y abajo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102023;color:#e8eeeb;font:16px/1.5 system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;font-size:28px}p{color:#b9cfca}a{color:#b5e4ce}button,select{font:inherit;padding:8px 12px;background:#294a42;color:white;border:1px solid #82b9ad;border-radius:6px}button{cursor:pointer}.tools{position:sticky;top:0;padding:12px 0;background:#102023;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{padding:14px;border:1px solid #3c615a;border-radius:8px;background:#19322f}h2{font-size:18px;margin:0}canvas{display:block;width:100%;background:#778780;margin-top:10px}.status{font-size:13px;color:#bdd2cc;margin:8px 0 0}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
<main><h1>Ciudad · hacia arriba y hacia abajo</h1>
<p>Las animaciones actuales del juego, sin retocarlas. Cada personaje aparece de espaldas y de frente, ampliado para revisar piernas, brazos y centrado. Dime el número o nombre y la dirección que quieres corregir.</p>
<div class="tools"><button id="play">Pausar</button><label>Velocidad <select id="speed"><option value=".5">0,5×</option><option value="1" selected>1× · juego</option></select></label><label>Pose <select id="pose"><option value="0">1</option><option value="1">2</option></select></label><a href="index.html?v=fixed-registration">Ver laterales</a></div>
<div class="grid" id="grid"></div><p id="loading">Cargando personajes…</p></main>
<script type="module">
import{STAGE_SPECIES,ATLAS_URLS}from'../../app/journey-data.mjs';
import{drawJourneySprite}from'../../app/journey-sprites.mjs';
const images={},cards=[],people=STAGE_SPECIES[4].filter(s=>s.directionalArt?.kind==='human');
try{
for(const [i,s] of people.entries()){
 const im=new Image();im.src=new URL(ATLAS_URLS[s.imageAtlas],location.origin+'/');await im.decode();images[s.imageAtlas]=im;
 const article=document.createElement('article'),h=document.createElement('h2'),canvas=document.createElement('canvas'),caption=document.createElement('p');
 h.textContent=`${i+1}. ${s.name}`;canvas.width=700;canvas.height=430;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`${s.name}: animaciones hacia arriba y hacia abajo`);caption.className='status';caption.textContent='2 poses por dirección · mismo dibujado y ritmo que en el juego';article.append(h,canvas,caption);document.querySelector('#grid').append(article);cards.push({s,canvas});
}
document.querySelector('#loading').textContent='10 personajes listos. La línea marca el suelo y la pequeña marca superior, el centro.';
let playing=true,t=0,last=performance.now();
const play=document.querySelector('#play');play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Reanudar';};
document.querySelector('#pose').onchange=()=>{playing=false;play.textContent='Reanudar';};
function draw(){
 const now=performance.now();if(playing)t+=Math.max(0,Math.min(.1,(now-last)/1000))*Number(document.querySelector('#speed').value);last=now;
 for(const{s,canvas}of cards){
  const box=canvas.getBoundingClientRect();if(box.bottom<0||box.top>innerHeight)continue;
  const c=canvas.getContext('2d');c.clearRect(0,0,700,430);c.textAlign='center';c.font='23px system-ui';c.fillStyle='#142d29';
  const time=playing?t:(Number(document.querySelector('#pose').value)+.1)*Math.PI/9;
  for(const [i,heading]of[-Math.PI/2,Math.PI/2].entries()){
   const x=175+i*350;c.strokeStyle='#c9e6dc';c.lineWidth=1;c.beginPath();c.moveTo(x-140,350);c.lineTo(x+140,350);c.moveTo(x,43);c.lineTo(x,58);c.stroke();
   c.save();c.translate(x,200);drawJourneySprite(c,images,s.id,300/s.directionalArt.heightPerRadius,0,time+1e-6,1,0,null,heading);c.restore();
   c.fillText(i?'↓ Hacia abajo · de frente':'↑ Hacia arriba · de espaldas',x,394);
  }
 }
 requestAnimationFrame(draw);
}requestAnimationFrame(draw);document.documentElement.dataset.ready='true';
}catch(error){document.querySelector('#loading').textContent='No se pudieron cargar los personajes: '+error.message;throw error;}
</script></html>
