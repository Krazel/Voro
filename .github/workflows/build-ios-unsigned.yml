name: Build iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build for iPhone
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          test -f build/ios/Build/Products/Release-iphoneos/App.app/public/index.html
          test -f build/ios/Build/Products/Release-iphoneos/App.app/public/abyssal-background.png
          test -f build/ios/Build/Products/Release-iphoneos/App.app/public/near-atlas.png
          test -f build/ios/Build/Products/Release-iphoneos/App.app/public/space-atlas.png
          mkdir -p artifact/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app artifact/Payload/
          cd artifact
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/App.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/App.app/Info.plist)
          SHORT_SHA=${GITHUB_SHA:0:8}
          zip -qr "Voro-iPhone-v${VERSION}-build-${BUILD}-${SHORT_SHA}-Local-QA-unsigned.ipa" Payload
          printf '{"version":"%s","build":"%s","commit":"%s","run":"%s","purpose":"Local-QA","signed":false}\n' "$VERSION" "$BUILD" "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-manifest.json
          shasum -a 256 *.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Voro-iPhone-IPA
          path: |
            artifact/*.ipa
            artifact/build-manifest.json
            artifact/SHA256SUMS.txt
          retention-days: 7
