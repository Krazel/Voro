name: VORO native membrane settings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare settings UI test
        run: |
          node scripts/membrane-settings-fixture.mjs
          cp scripts/MembraneSettingsCheckpoint.swift scripts/StoreCapture.swift
      - run: npm run ios:sync
      - name: Add capture-only XCTest target
        run: |
          gem install xcodeproj --no-document --user-install
          ruby scripts/store-capture-setup.rb
      - name: Select iPhone and iPad simulators
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os
          ds=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          names=['iPhone 17 Pro Max','iPhone 16 Pro Max','iPhone 16 Plus'] if os.environ['DEVICE']=='iphone' else ['iPad Pro 13-inch (M5)','iPad Pro 13-inch (M4)']
          devices=[d for values in ds.values() for d in values]
          device=next(d for n in names for d in devices if d['name']==n)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+device['udid']+'\n')
          print(device['name'])
          PY
      - name: Capture actual native runtime
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -o pipefail
          mkdir -p artifact/native-captures
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild test -project ios/App/App.xcodeproj -scheme StoreCapture -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RUNNER_TEMP/capture.xcresult" \
            CODE_SIGNING_ALLOWED=NO > artifact/native-captures/xcodebuild.log 2>&1
      - name: Export screenshots and source provenance
        if: always()
        run: |
          mkdir -p artifact/native-captures
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/capture.xcresult" --output-path artifact/native-captures/attachments || true
          git rev-parse HEAD > artifact/native-captures/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VORO-membrane-settings-${{ matrix.device }}
          path: artifact/native-captures/
          retention-days: 7
